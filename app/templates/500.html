{% extends "base.html" %}

{% block title %}Internal Server Error — BlogHub{% endblock %}

{% block content %}
<main class="error-page-section">
    <div class="error-card">
        <div class="error-code text-gradient">500</div>
        <h1 class="error-title">Internal Server Error</h1>
        <p class="error-desc">
            Something unexpected went wrong on our servers while processing your request. Please try again later.
        </p>
        <a href="/" class="btn btn-primary btn-lg">
            Return to Homepage
        </a>
    </div>
</main>
{% endblock %}
