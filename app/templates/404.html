{% extends "base.html" %}

{% block title %}Page Not Found — BlogHub{% endblock %}

{% block content %}
<main class="error-page-section">
    <div class="error-card">
        <div class="error-code text-gradient">404</div>
        <h1 class="error-title">User or Page Not Found</h1>
        <p class="error-desc">
            Sorry, the page or user profile you are looking for does not exist or may have been moved.
        </p>
        <a href="/" class="btn btn-primary btn-lg">
            Return to Homepage
        </a>
    </div>
</main>
{% endblock %}
