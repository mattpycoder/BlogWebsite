repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: ruff format .
        language: system
        pass_filenames: false

      - id: ruff-check
        name: Ruff check
        entry: ruff check .
        language: system
        pass_filenames: false

      - id: ty-check
        name: Ty check
        entry: ty check .
        language: system
        pass_filenames: false